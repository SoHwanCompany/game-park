name: Sync to Vercel repo

on:
  push:
    branches: [main, develop]

jobs:
  sync:
    if: github.repository == 'SoHwanCompany/game-park'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to personal repo
        run: |
          git remote add vercel-repo https://x-access-token:${{ secrets.PERSONAL_REPO_TOKEN }}@github.com/tykimdream/game-park.git
          git push vercel-repo ${{ github.ref_name }} --force
